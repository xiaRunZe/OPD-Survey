# GitHub Actions: 每日自动拉取 arXiv OPD/OPSD 相关论文
# 方案参考：知乎 Realcat "arXiv API + Github Actions 实现每天自动获取arXiv论文摘要"
# 原文：https://zhuanlan.zhihu.com/p/425670267
#
# 维护策略（2026-06-08 立）：
#   - 本 workflow 默默运行，产物仅写入 daily-updates/ 目录
#   - 不修改 README.md（仓库永远保持静态归档外观）
#   - 不在 README 链接 daily-updates/ 目录
#   - 新论文解读由维护者手动 commit 到对应 papers/0X-{topic}.md 章节末尾
#
# 流程：
#   1. 每天 UTC 13:00 / 17:00（北京时间 21:00 / 次日 01:00）触发
#      - 双时间点：降低 GitHub Actions schedule 偶发延迟/失败的概率
#   2. 安装 arxiv 库
#   3. 运行 auto_update.py → 生成 daily-updates/auto-latest.md
#   4. 追加当天的 daily-updates/{YYYY-MM-DD}.md
#   5. 自动 commit + push（仅修改 daily-updates/，不触碰 README 与 papers/）

name: Daily arXiv OPD/OPSD Update

on:
  # 允许手动触发
  workflow_dispatch:
  # 定时任务：每天 UTC 13:00 + 17:00（双时间点兜底）
  schedule:
    # UTC 13:00 = 北京 21:00
    - cron: "0 13 * * *"
    # UTC 17:00 = 北京次日 01:00（兜底，若 13:00 延迟/失败）
    - cron: "0 17 * * *"

permissions:
  contents: write

jobs:
  update-papers:
    name: Update OPD papers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install arxiv

      - name: Run auto_update
        run: |
          python scripts/auto_update.py \
            --query "on-policy distillation" \
            --max 100 \
            --out daily-updates/auto-latest.md

      - name: Append to daily log
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          DAILY_FILE="daily-updates/${TODAY}.md"
          if [ ! -f "$DAILY_FILE" ]; then
            echo "# 📅 ${TODAY} 每日 OPD/OPSD 论文速读" > "$DAILY_FILE"
            echo "" >> "$DAILY_FILE"
            echo "> 每日由 GitHub Actions 自动从 arXiv 拉取。" >> "$DAILY_FILE"
            echo "" >> "$DAILY_FILE"
            echo "## 自动拉取结果" >> "$DAILY_FILE"
            echo "" >> "$DAILY_FILE"
            cat daily-updates/auto-latest.md >> "$DAILY_FILE"
            echo "" >> "$DAILY_FILE"
            git add "$DAILY_FILE"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto: daily OPD/OPSD paper update $(date -u +%Y-%m-%d)"
            git push
          fi
