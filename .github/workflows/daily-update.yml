# GitHub Actions: 每日自动拉取 arXiv OPD/OPSD 相关论文
# 方案参考：知乎 Realcat "arXiv API + Github Actions 实现每天自动获取arXiv论文摘要"
# 原文：https://zhuanlan.zhihu.com/p/425670267
#
# 流程：
#   1. 每天 UTC 12:00（北京时间 20:00）触发
#   2. 安装 arxiv 库
#   3. 运行 auto_update.py → 生成 daily-updates/auto-latest.md
#   4. 自动 commit + push

name: Daily arXiv OPD/OPSD Update

on:
  # 允许手动触发
  workflow_dispatch:
  # 定时任务：每天 UTC 12:00 = 北京时间 20:00
  schedule:
    # 每天 UTC 13:00 = 北京时间 21:00（晚上 9 点）
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  update-papers:
    name: Update OPD papers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install arxiv

      - name: Run auto_update
        run: |
          python scripts/auto_update.py \
            --query "on-policy distillation" \
            --max 100 \
            --out daily-updates/auto-latest.md

      - name: Append to daily log
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          DAILY_FILE="daily-updates/${TODAY}.md"
          if [ ! -f "$DAILY_FILE" ]; then
            echo "# 📅 ${TODAY} 每日 OPD/OPSD 论文速读" > "$DAILY_FILE"
            echo "" >> "$DAILY_FILE"
            echo "> 每日由 GitHub Actions 自动从 arXiv 拉取。" >> "$DAILY_FILE"
            echo "" >> "$DAILY_FILE"
            echo "## 自动拉取结果" >> "$DAILY_FILE"
            echo "" >> "$DAILY_FILE"
            cat daily-updates/auto-latest.md >> "$DAILY_FILE"
            echo "" >> "$DAILY_FILE"
            git add "$DAILY_FILE"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto: daily OPD/OPSD paper update $(date -u +%Y-%m-%d)"
            git push
          fi
